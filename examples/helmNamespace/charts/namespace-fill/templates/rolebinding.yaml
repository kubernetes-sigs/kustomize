apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Release.Name }}-role
subjects:
# a subject named "default" without a namespace; kustomize fills it
- kind: ServiceAccount
  name: default
# a subject namespace rendered by the chart; kustomize preserves it
- kind: ServiceAccount
  name: default
  namespace: chart-owned-ns
# a subject not named "default"; kustomize never touches it
- kind: ServiceAccount
  name: app-service-account
