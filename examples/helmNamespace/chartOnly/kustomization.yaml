apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# No top-level namespace here on purpose: the namespace comes only from
# helmCharts[].namespace, so no explicit namespace transformer is configured.

# The chart is shared with the sibling topLevelNamespace example, so building
# requires --load-restrictor LoadRestrictionsNone to reach above this root.
helmGlobals:
  chartHome: ../charts

helmCharts:
- name: namespace-fill
  releaseName: test-c
  namespace: helm-only-ns
