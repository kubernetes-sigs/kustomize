name: Bug report
description: File a bug report
labels: ["kind/bug"]
body:
  - type: markdown
    attributes:
      value: |
        Before filing, read the [contribution rules](https://github.com/kubernetes-sigs/kustomize/blob/master/CONTRIBUTING.md), including duplicate search and human-authored AI disclosure requirements.

  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: |
        Please provide as much info as possible. Not doing so may result in your bug not being addressed in a timely manner.
        If this matter is security related, please disclose it privately via https://kubernetes.io/security
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: repro-files
    attributes:
      label: How can we reproduce it (as minimally and precisely as possible)?
      description: Please provide a minimum set of files that can reproduce the issue. You can paste the file contents here or provide a link to a tarball or git repo. Even better, submit a tests case in the api/krusty package! For more information on how to do that, see https://kubectl.docs.kubernetes.io/contributing/kustomize/bugs/.
      value: | 
        ```yaml
        # kustomization.yaml
        apiVersion: kustomize.config.k8s.io/v1beta1
        kind: Kustomization
        resources:
        - resources.yaml
        ```
    
        ```yaml
        # resources.yaml
        apiVersion: v1
        kind: ConfigMap
        metadata:
          name: test-object
        data:
          placeholder: data
        ```
    validations:
      required: true  
  - type: textarea
    id: expected-output
    attributes:
      label: Expected output
      description: If you are able to provide reproduction files, please include the output you expect here.
      value: | 
        ```yaml

        ```
    validations:
      required: false
  - type: textarea
    id: actual-output
    attributes:
      label: Actual output
      description: If you are able to provide reproduction files, please include the output they currently produce here.
      value: | 
        ```yaml

        ```
    validations:
      required: false
  - type: input
    id: kustomize-version
    attributes:
      label: Kustomize version
      description: Please use the latest version whenever possible.
      placeholder: What version of Kustomize are you using?
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux
        - MacOS
        - Windows
        - Other
    validations:
      required: false

  - type: textarea
    id: duplicate-search
    attributes:
      label: Duplicate search
      description: Search open and closed issues and open, closed, and merged pull requests. List exact queries and any relevant results and differences; if none exist, say so.
      placeholder: |
        Queries:
        - is:issue "short error text"
        - is:pr component-name behavior

        Closest relevant results and differences, or "No relevant results from the queries above":
        - https://github.com/kubernetes-sigs/kustomize/issues/... — ...
    validations:
      required: true

  - type: dropdown
    id: ai-use
    attributes:
      label: Generative AI use
      description: Did you use generative AI to draft this issue, analyze its subject, or prepare proposed content or a patch included with it? AI use must be disclosed.
      options:
        - "No"
        - "Yes"
    validations:
      required: true

  - type: input
    id: ai-model
    attributes:
      label: AI tool and model
      description: If yes, give the provider, product, model, and version. Use "unknown/auto-selected" when the model is not exposed. If no AI was used, enter "None."
      placeholder: None, or provider / product / model / version
    validations:
      required: true

  - type: textarea
    id: ai-usage
    attributes:
      label: How was AI used?
      description: Briefly describe assistance with code, research, analysis, copy-editing, or translation. Do not paste prompts or transcripts. If no AI was used, enter "None."
      placeholder: None, or a brief factual description
    validations:
      required: true

  - type: checkboxes
    id: submission-confirmations
    attributes:
      label: Submission confirmations
      options:
        - label: I searched for duplicates using the queries above and reviewed any relevant results.
          required: true
        - label: I wrote the substantive content of this issue myself and kept it concise. Any light copy-editing or translation assistance is disclosed above.
          required: true
