name: Feature request
description: Propose an enhancement to Kustomize
labels: ["kind/feature"]
body:
  - type: markdown
    attributes:
      value: |
        Small, straightforward enhancements can be proposed in regular GitHub issues using the template below. As a rule of thumb, the enhancement should be resolvable in a single PR that is at most size L. Anything more involved requires a mini (in-repo) enhancement proposal, and features with implications for kubectl require a full [KEP](https://github.com/kubernetes/enhancements). 

        Before filing, read the [contribution rules](https://github.com/kubernetes-sigs/kustomize/blob/master/CONTRIBUTING.md), including duplicate search and human-authored AI disclosure requirements.
         
        For more information on the Kustomize enhancement process, see: https://github.com/kubernetes-sigs/kustomize/tree/master/proposals.      
         
        When in doubt, go ahead and fill out the template below; the maintainers will let you know if a KEP is required.

  - type: checkboxes
    id: eschewed-features
    attributes:
      label: Eschewed features
      description: Some features are out of scope for Kustomize because they are incompatible with its foundational design principles. Please review the [Eschewed Features](https://kubectl.docs.kubernetes.io/faq/kustomize/eschewedfeatures/) documentation before submitting your feature request.
      options:
      - label: This issue is not requesting templating, unstuctured edits, build-time side-effects from args or env vars, or any other eschewed feature.
        required: true

  - type: textarea
    id: feature-description
    attributes:
      label: What would you like to have added?
    validations:
      required: true

  - type: textarea
    id: rationale
    attributes:
      label: Why is this needed?
    validations:
      required: true
      
  - type: textarea
    id: current-alternatives
    attributes:
      label: Can you accomplish the motivating task without this feature, and if so, how?
    validations:
      required: true      
      
      
  - type: textarea
    id: design-alternatives
    attributes:
      label: What other solutions have you considered?
    validations:
      required: true        

  - type: textarea
    id: additional-info
    attributes:
      label: Anything else we should know?
    validations:
      required: false
      
  - type: checkboxes
    id: feature-ownership
    attributes:
      label: Feature ownership
      description: The Kustomize project, like many areas of Kubernetes, currently lacks enough contributors to adequately respond to all proposals that have merit. Offering to build and support the feature yourself can help get traction for your request.
      options:
      - label: I am interested in contributing this feature myself! 🎉
        required: false

  - type: textarea
    id: duplicate-search
    attributes:
      label: Duplicate search
      description: Search open and closed issues and open, closed, and merged pull requests. List exact queries and any relevant results and differences; if none exist, say so.
      placeholder: |
        Queries:
        - is:issue feature-name use-case
        - is:pr component-name behavior

        Closest relevant results and differences, or "No relevant results from the queries above":
        - https://github.com/kubernetes-sigs/kustomize/issues/... — ...
    validations:
      required: true

  - type: dropdown
    id: ai-use
    attributes:
      label: Generative AI use
      description: Did you use generative AI to draft this issue, analyze its subject, or prepare proposed content or a patch included with it? AI use must be disclosed.
      options:
        - "No"
        - "Yes"
    validations:
      required: true

  - type: input
    id: ai-model
    attributes:
      label: AI tool and model
      description: If yes, give the provider, product, model, and version. Use "unknown/auto-selected" when the model is not exposed. If no AI was used, enter "None."
      placeholder: None, or provider / product / model / version
    validations:
      required: true

  - type: textarea
    id: ai-usage
    attributes:
      label: How was AI used?
      description: Briefly describe assistance with code, research, analysis, copy-editing, or translation. Do not paste prompts or transcripts. If no AI was used, enter "None."
      placeholder: None, or a brief factual description
    validations:
      required: true

  - type: checkboxes
    id: submission-confirmations
    attributes:
      label: Submission confirmations
      options:
        - label: I searched for duplicates using the queries above and reviewed any relevant results.
          required: true
        - label: I wrote the substantive content of this issue myself and kept it concise. Any light copy-editing or translation assistance is disclosed above.
          required: true
