name: Sync Dependabot Go workspace

on:
  push:
    branches:
    - "dependabot/go_modules/**"

permissions:
  contents: read

concurrency:
  group: dependabot-go-workspace-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.sync.outputs.changed }}
    steps:
    - name: Check out the Dependabot branch
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        ref: ${{ github.sha }}
    - name: Verify the update only changes Go dependency files
      env:
        BASE_BRANCH: ${{ github.event.repository.default_branch }}
      run: |
        git diff --name-only "origin/${BASE_BRANCH}...HEAD" |
        while IFS= read -r path; do
          case "${path}" in
            go.mod|go.sum|go.work.sum|*/go.mod|*/go.sum) ;;
            *)
              echo "Unexpected file in Dependabot update: ${path}"
              exit 1
              ;;
          esac
        done
    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.work
        cache: true
        cache-dependency-path: |
          **/go.sum
    - name: Generate workspace changes
      id: sync
      run: |
        make workspace-sync

        if git diff --quiet; then
          echo "The Go workspace is already synchronized"
          echo "changed=false" >> "${GITHUB_OUTPUT}"
        else
          git diff --binary -- go.work.sum ':(glob)**/go.mod' ':(glob)**/go.sum' > "${RUNNER_TEMP}/workspace-sync.patch"
          echo "changed=true" >> "${GITHUB_OUTPUT}"
        fi
    - name: Upload workspace changes
      if: steps.sync.outputs.changed == 'true'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: workspace-sync-${{ github.sha }}
        path: ${{ runner.temp }}/workspace-sync.patch
        if-no-files-found: error
        retention-days: 1

  writeback:
    needs: generate
    if: needs.generate.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
    steps:
    - name: Check out the Dependabot branch
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ github.ref_name }}
    - name: Verify the branch has not changed
      run: |
        if [[ "$(git rev-parse HEAD)" != "${GITHUB_SHA}" ]]; then
          echo "The Dependabot branch changed while the workspace was being synchronized"
          exit 1
        fi
    - name: Download workspace changes
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: workspace-sync-${{ github.sha }}
        path: ${{ runner.temp }}
    - name: Apply workspace changes
      run: |
        git apply --check "${RUNNER_TEMP}/workspace-sync.patch"
        git apply "${RUNNER_TEMP}/workspace-sync.patch"

        git diff --name-only |
        while IFS= read -r path; do
          case "${path}" in
            go.mod|go.sum|go.work.sum|*/go.mod|*/go.sum) ;;
            *)
              echo "Unexpected file in workspace sync: ${path}"
              exit 1
              ;;
          esac
        done
    - name: Commit workspace changes
      run: |
        git config user.name "dependabot[bot]"
        git config user.email "49699333+dependabot[bot]@users.noreply.github.com"
        git add -- go.work.sum ':(glob)**/go.mod' ':(glob)**/go.sum'
        git commit -m "build(deps): sync Go workspace [dependabot skip]"
        git push origin "HEAD:${GITHUB_REF_NAME}"
    - name: Run Go CI for the synchronized commit
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh workflow run go.yml --repo "${GITHUB_REPOSITORY}" --ref "${GITHUB_REF_NAME}"
